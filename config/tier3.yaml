# config/tier3.yaml
# Tier 3: labelled speculation, applied on top of tier 2. No entry here has
# a source; each is the optimistic edge of a stated argument or an explicit
# leap. Geometry note: this tier does NOT keep the design-basis 0.61 m x
# 10 m chamber, sized to survive exactly the 128 MJ design-basis shot; any
# larger yield flash-melts that wall (per-shot areal energy over the
# tungsten bound), so scripts/coherent_min.py solves the chamber size and
# yield jointly under the wall constraints instead of asserting Q = 40 in a
# chamber that cannot survive it. yield_per_shot_mj therefore has no entry
# in this file; the coherent scan owns it, together with the compression
# field (b_center, scanned 22 to 50 T at this grade, past the coil's
# mechanical basis and labelled so) and the driver bank (e_driver_mj,
# scanned 50 to 200 MJ): both are design-search dimensions graded in
# scripts/coherent_min.py and docs/ledger.md, not records here.

records:
  max_f_rep:
    value: 10.0
    source: "SPECULATION: top of the third-party 1-10 Hz roadmap band. No duty-cycle analysis (thermal, switch, vacuum recovery at 100 ms period) supports it; largest rep-rated MJ-class precedent is orders of magnitude away."

  cap_shot_lifetime:
    value: 1.0e+10
    source: "SPECULATION: required for coherence with 10 Hz (9e9 shots over an 80-yr-book plant would otherwise replace the bank ~10x); no source at any price. Cost-at-life scaling says this multiplies capacitor $/J, which the c_cap entry below IGNORES - the two are jointly heroic."

  eta_dec:
    value: 0.95
    source: "SPECULATION: with f_pdv below, composite 0.90 = the APS DPP24 theory optimum ('optimal cycles exceeding 90%') taken at face value with zero engineering margin."


  f_pdv:
    value: 0.947
    source: "SPECULATION: with eta_dec above, composite = 0.90, the theory optimum exactly. Requires ~80x adiabatic volume expansion with full fusion-product thermalization and negligible transport during expansion."

  c_cap_allin_per_joule:
    value: 0.1
    source: "SPECULATION: below the model's own documented 0.5-4.0 range floor, against the industry statement that Hz-rate operation still needs a 5-10x cost cut. Directly contradicts the derating physics that buys cap_shot_lifetime above."

  u_he3:
    value: 5.0e+5
    source: "SPECULATION: no fleet-scale He-3 market exists at any price; baseline 2e6 $/kg already prices a kilogram as though supply were liquid."

  dec_staged_recovery_factor:
    value: 0.5
    source: "SPECULATION: the patent's 'net reduction in cost and size' for staged recovery is unquantified; the capacitor report's duty analysis puts the credit plausibly below 2x. 0.5 is the optimistic edge."

  c_inv_per_kw_net:
    value: 50.0
    source: "SPECULATION: grid-tie inverter at a third of the modeled $/kW. Small lever."

  multi_unit_labor_factor:
    value: 0.80
    source: "SPECULATION: fleet installation-labor learning beyond the modeled 0.92. Small lever."

  interest_rate:
    value: 0.03
    source: "SPECULATION: cost of capital at the IEA/NEA 2020 low case, sovereign-class capital with no mechanism that delivers it to a first-of-a-kind fusion fleet."

  construction_time_yr:
    value: 2.5
    source: "SPECULATION: a CCGT-class build (Siemens Energy 1200 MWe combined-cycle block in about 30 months) for a fusion module with a tritium facility; no fusion plant has a build record. Effective indirects 8.3% at this build. Same ruling as the Magnetic D-T Corridor ladder."

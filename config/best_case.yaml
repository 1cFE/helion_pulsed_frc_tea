# config/best_case.yaml
# Tier 1, the citable-records device. Applied on top of baseline.yaml.
# Contains ONLY the reversions of Helion's unrecorded performance claims
# to their record-supported values; the plant-environment basis
# (financing, availability) is common to all four priced devices and
# lives in baseline.yaml, so the ladder rungs differ in physics and
# technology, not in interest rates.
# Post-red-team composition: eta_dec 0.97 (patent prophetic band, not a
# record) and cap_shot_lifetime 1e9 (published TARGET resting on a vendor
# catalog extrapolation, not a life test) are REMOVED from this tier and
# carried in tier2.yaml as labelled extrapolations. lifetime_yr is held at
# 30: on this concept 80 years is an anti-record until capacitor life
# reaches 1e9 (replacement accumulates faster than the capital-recovery
# benefit), so it is adopted only in tier 3 where that condition holds.

records:
  fuel_recovery:
    value: 0.999
    source: "Anti-record reversion from the vendor-implied 0.9999 basis: the per-pulse loss channel is wall retention plus pump slip in a sealed recirculation loop, and the measured analog is JET-ILW gas-balance long-term fuel retention, 0.1-0.3% of injected throughput (Brezinsek et al., JET-ILW fuel retention studies), i.e. per-pass recovery about 0.997-0.999 with helium retaining less than hydrogen. Records support three nines, not four."
  f_pdv_radial_share:
    value: 0.8
    source: "Radial-only recovery: FRC adiabatic scalings (r_s ~ B^-2/5, l ~ B^-1/5) put about 1/5 of the expansion boundary work in axial elongation, which changes flux linkage through the END coils and is captured only if those circuits are switched for recovery during the stroke. The vendor's talk states the radial-axial coupling (Spencer 1983 length scaling) but not recovery of the axial work; radial-only is the record-supported share. f_pdv is then derived per point as share x (1 - (V_i/V_f)^(2/3)) with V_i the compressed flux volume at the 22 T basis field (study.f_pdv_cap). Reverted from the vendor basis (share 1.0, the unchallenged implied design)."

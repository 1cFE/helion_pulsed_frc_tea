# config/tier2.yaml
# Tier 2: labelled extrapolations, applied on top of tier 1.
# Post-red-team composition. Three structural changes from the earlier draft:
# (1) the recovery pair is capped as a COMPOSITE (<= 0.80), with f_pdv
#     DERIVED per point from the chamber-coupled radial bound
#     (study.f_pdv_cap x the tier-1 radial share 0.8): the only published figure ("optimal burn cycles exceeding
#     90% recovery", APS DPP24) speaks to the product, and assigning 0.95
#     and 0.97 to the factors separately double-booked it;
# (2) max_f_rep is 3 Hz WITH the divertor-class wall bought explicitly
#     (fw_class hhf, priced in-model at 2.5 M$/m^2 on the real cylinder
#     area), because 10 Hz exceeds any wall the study can cost and every
#     public Helion cadence statement; 10 Hz moves to tier 3;
# (3) the D-rich burn mix carries its bremsstrahlung-consistent radiated
#     fraction (f_rad 0.28, from the review's Bosch-Hale + brems table at
#     the study calibration) and scripts/study.py charges the tritium-plant
#     adder for it - the fuel credit and its physical consequences travel
#     together or not at all.
# Held at baseline, harmonized with the Borealis ledger: om_cost_dhe3
# (27.5, lowest documented CCGT fixed-O&M already), installation_frac
# (0.14, no defensible record on this cost basis), inflation (tier 1).

records:
  cap_shot_lifetime:
    value: 1.0e+9
    source: "Pacific Fusion AMPS (arXiv:2504.10680 sec 4.1): 100->35 kV derating projected to reach ~1e9 shots at ~9x lower energy density. A published NOAK TARGET resting on a vendor catalog extrapolation - tier 2, not the record grade an earlier draft gave it. At about 3 Hz over the 80 yr book life the bank fires about 7e9 shots and is replaced about 7x, charged to CAS72 by the model at the derived availability."

  eta_dec:
    value: 0.90
    source: "Bottom of the Helion patent band (US 2024/0275198 A1: 'up to 90% and higher'), circuit-only, prophetic language, no fusion-inclusive measurement. Paired with f_pdv below under the composite cap."


  eta_pin:
    value: 0.98
    source: "UNSOURCED-PLAUSIBLE: modern solid-state pulsed-power wall-plug efficiency; no device datasheet or Helion statement located. Worth little alone; retained with this grade."

  max_f_rep:
    value: 3.0
    source: "UNSOURCED-ROADMAP, wall-limited: no public Helion statement of a numeric plant rep rate exists (Polaris target ~1/s; Trenta ~1/10 min). 3 Hz is the ceiling the bought hhf wall class supports at this tier's recovery parameters; the 1-10 Hz band's top is tier 3."

  fw_class:
    value: hhf
    source: "Machine design purchase, not a record: divertor-grade monoblock wall (ITER divertor procurement anchor, 2.5 M$/m^2 NOAK, 10 MW/m^2 qualification) bought over the real 44.6 m^2 design-basis cylinder area to make 3 Hz admissible. About 112 M$/module."

  dhe3_dd_frac:
    value: 0.85
    source: "D-rich operation for in-situ He-3 breeding - the concept's own direction, but 0.85 is the top of a sweep, not an operating point. Carried WITH its consequences: f_rad below, tritium adder in study.py (41 kg/yr bred tritium at this mix), O&M held at baseline."

  f_rad:
    value: 0.28
    source: "Bremsstrahlung-consistent radiated fraction at dd_frac 0.85 under the study calibration (the blog-derived pair 0.163 at 0.314 -> T_i 60-70 keV; Bosch-Hale + non-relativistic brems; relativistic corrections raise it further). Replaces the withdrawn 0.05, which was below the physical floor."
  fuel_recovery:
    value: 0.9999
    source: "Labelled extrapolation, one nine beyond the JET-ILW retention record: the patent closed fuel cycle (US 2017/0011811) implies four-nines per-pulse recovery for the He-3 economy to close, and the physical argument (saturated walls, helium-dominated exhaust, direct re-injection without full reprocessing) points the right direction. No demonstration at any scale; each nine is first-order in the fuel line."

  wall_dpa_tolerance:
    value: 50.0
    source: "DEMO-class RAFM first-wall design target, against the 20 dpa demonstrated database edge held at the records grade. Enters the ladder only through the wall-and-coil changeout interval in the derived availability; the wall replacement cost itself is priced in scripts/burnup_scan.py at both tolerances."

  interest_rate:
    value: 0.05
    source: "Cost of capital (financing), real: federal loan guarantees blended with utility equity, a mechanism with precedent but no fusion record; between the IEA/NEA 2020 central (7%) and low (3%) cases. Financing steps with the tiers; Figure 1 and the at-7% column of the ladder table keep it separate from physics and engineering."

  lifetime_yr:
    value: 80.0
    source: "Book life (engineering): US DOE hydropower civil-works lifespan (65-85 yr) with every core component replaced on its own schedule. An extrapolation with a mechanism here: the unreplaceable structure sees negligible neutron fluence (copper coils are replaced with the wall; D-D neutrons only). Capacitor-bank and wall replacements are priced at every rung (CAS72, scripts/burnup_scan.py), so the model shows where 80 yr is unfavorable rather than the ledger asserting it. 30 yr at the design basis and records grades is the model default and the low end of the fusion literature's 30-40 yr cluster (Böhnlein et al. 2026 survey of 43 assumptions; ARIES 40)."

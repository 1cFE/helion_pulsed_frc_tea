# config/baseline.yaml
# Helion-class pulsed D-He3 FRC with inductive DEC - DESIGN BASELINE.
# This is Helion's own implied operating point, not an independent design:
# e_driver_mj = 50 is sourced (Polaris capacitor bank), max_f_rep = 1 Hz is
# third-party (NRC filing ML21026A315, IEEE Spectrum), and the concept
# YAML's yield (101.4 MJ) is back-derived so the model's own DEC chain
# reproduces Helion's 50 MWe PPA claim at 1 Hz. The shot design point stays
# at the concept-YAML values and is not overridden here.
#
# Conversion is inductive DEC only, no turbine (eta_th = 0 is the concept
# preset): radiated and non-recovered charged energy is discarded, not
# bottomed. A thermal-bottoming add-back is carried in
# scripts/reconciliation.py, mirroring how Borealis carried its excluded
# DEC add-back.

concept: pulsed_frc
fuel: dhe3

forward:
  # --- Customer requirements (baseline anchor; scale scan varies this) ---
  # 1 GWe as an integer count of Helion-class modules, for comparability
  # with borealis_mirror_tea and the down-select. Helion's 50 MWe PPA unit
  # is a point on the scale scan, not the baseline.
  net_electric_mw: 1000.0

  # --- Plant environment: held and stepped ---
  # Held at every rung (this file): constant-dollar framing (inflation_rate
  # 0, so capital, replacements and operating costs are discounted at one
  # real rate); 2.5 yr construction (Siemens Energy 1200 MWe CCGT block in
  # about 30 months); EPCM indirects 8% of direct cost (US DOE/NETL QGESS
  # low end), entered as 0.192 because the model scales CAS30 by
  # construction_time_yr / 6 yr and the NETL fraction already belongs to a
  # short build.
  # Stepped with the tiers: the cost of capital (financing: 7% real here and
  # at the records grade, the IEA/NEA 2020 central case; 5% at
  # extrapolations, 3% at speculation, each a tier-2 or tier-3 record) and
  # the book life (engineering: 30 yr here and at the records grade, the
  # model default and the low end of the fusion literature's 30-40 yr
  # cluster; 80 yr from the extrapolation grade, a civil-works record).
  # Derived, never asserted: availability. scripts/study.py starts from the
  # US fission fleet's availability outside its planned outages (0.98: a
  # 92-93% capacity factor, EIA 2023-2024, less refueling outages of 34-38 d
  # per 18-24 month cycle leaves 1-3% of unplanned loss; the fleet's
  # unplanned capability loss factor is 1.6% against a 4.1% world average,
  # WEC/Solomon 2006 on PRIS data) and removes three planned outages: a
  # routine maintenance bundle every cycle, sized by the fission refueling
  # outage that carries the fleet's routine work; a capacitor-bank swap
  # every cap_shot_lifetime shots at the solved rep rate; and a
  # wall-and-coil changeout when the 14-MeV-equivalent neutron fluence
  # reaches the dpa tolerance (the coil bore sits 0.10 m behind the wall,
  # so nothing there outlives it). One sourced duration per event.
  availability_steady_state: 0.98   # US fission fleet outside planned outages (EIA capacity factor and refueling outages; WEC/Solomon 2006 UCL 1.6%)
  outage_days_routine: 34.0         # routine maintenance bundle per cycle: US refueling outage, 34 d average in 2024 (EIA)
  routine_cycle_yr: 2.0             # the 24-month cycle; US cycles run 18-24 months and this plant has no fuel reason to open
  outage_days_bank_swap: 34.0       # per swap: a refueling-outage-class event, modular units swapped rack by rack (EIA, 34 d)
  outage_days_wall: 84.0            # per changeout: Thea Helios budgets 84 days per biennial maintenance cycle (arXiv 2512.08027)
  wall_dpa_tolerance: 20.0          # demonstrated RAFM database edge; the DEMO-class 50 dpa target is a tier-2 record
  lifetime_yr: 30.0
  construction_time_yr: 2.5
  interest_rate: 0.07               # real; IEA/NEA 2020 central case
  inflation_rate: 0.0               # constant-dollar framing
  indirect_fraction: 0.192          # 8% effective at 2.5 yr (CAS30 = f x CAS20 x T/6)
  noak: true

  # --- Burn point: the vendor's own (US 11,469,003 B2 operating table) ---
  # The patent's tritium-removal column is a self-fueled catalyzed D-D
  # plasma: He3/D = 0.158, n_D 0.75e22 m^-3, T_i = T_e = 70 keV, B = 22 T,
  # bremsstrahlung fraction 0.23, neutron fraction 0.06, 72 MW at 1 Hz.
  # dhe3_dd_frac is the D-D share of primary fusion events by count, not an
  # ion ratio: He3/D = 0.158 at 70 keV (Bosch-Hale) is 0.488. f_rad 0.23 is
  # the patent's own bremsstrahlung fraction at T_e = T_i; it sits above the
  # study's f_rad_floor() at this mix (0.20, calibrated with T_e = T_i/2 on
  # the blog-derived pair 0.163 at 0.314), so the vendor point is the more
  # conservative of the two. (The concept YAML's shipped default, f_rad 0.05
  # at dd_frac 0.131, is below the floor; this baseline does not use it.)
  # Vendor-implied per-pulse exhaust recovery (the closed-cycle fourth nine,
  # US 11,469,003 B2); the model default is the JET-ILW-analog 0.999, so the
  # vendor point carries its own value explicitly. Tier 1 reverts it, tier 2
  # re-grants it as a labelled extrapolation.
  fuel_recovery: 0.9999
  dhe3_dd_frac: 0.488
  f_rad: 0.23

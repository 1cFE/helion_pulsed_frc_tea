# config/baseline.yaml
# Helion-class pulsed D-He3 FRC with inductive DEC - DESIGN BASELINE.
# This is Helion's own implied operating point, not an independent design:
# e_driver_mj = 50 is sourced (Polaris capacitor bank), max_f_rep = 1 Hz is
# third-party (NRC filing ML21026A315, IEEE Spectrum), and the concept
# YAML's yield (101.4 MJ) is back-derived so the model's own DEC chain
# reproduces Helion's 50 MWe PPA claim at 1 Hz. The shot design point stays
# at the concept-YAML values and is not overridden here.
#
# Conversion is inductive DEC only, no turbine (eta_th = 0 is the concept
# preset): radiated and non-recovered charged energy is discarded, not
# bottomed. A thermal-bottoming add-back is carried in
# scripts/reconciliation.py, mirroring how Borealis carried its excluded
# DEC add-back.

concept: pulsed_frc
fuel: dhe3

forward:
  # --- Customer requirements (baseline anchor; scale scan varies this) ---
  # 1 GWe as an integer count of Helion-class modules, for comparability
  # with borealis_mirror_tea and the down-select. Helion's 50 MWe PPA unit
  # is a point on the scale scan, not the baseline.
  net_electric_mw: 1000.0

  # --- Common plant-environment basis (shared by all four priced devices) ---
  # Financing and availability are not device properties: every rung is
  # financed on the same terms, so the ladder compares physics and
  # technology, not interest rates. Sources (graded in docs/ledger.md):
  # 4.25% nominal WACC (Apostoleris et al. 2021, sovereign-backed
  # long-term-offtake generation analog) against the 2% Fed longer-run
  # inflation backdrop; 2.5 yr construction (Siemens Energy 1200 MWe CCGT
  # block in about 30 months); 8% EPCM indirects (US DOE/NETL QGESS low
  # end); availability 0.95 (US DOE geothermal baseload analog derated
  # for staggered capacitor-bank swaps; diverges from Borealis 0.98 with
  # that stated technology reason).
  availability: 0.95
  lifetime_yr: 30.0           # standard TEA book life; 80 yr is an ANTI-record here (see ledger)
  construction_time_yr: 2.5
  interest_rate: 0.0425
  inflation_rate: 0.02
  indirect_fraction: 0.08
  noak: true

  # --- Burn point: the vendor's own (US 11,469,003 B2 operating table) ---
  # The patent's tritium-removal column is a self-fueled catalyzed D-D
  # plasma: He3/D = 0.158, n_D 0.75e22 m^-3, T_i = T_e = 70 keV, B = 22 T,
  # bremsstrahlung fraction 0.23, neutron fraction 0.06, 72 MW at 1 Hz.
  # dhe3_dd_frac is the D-D share of primary fusion events by count, not an
  # ion ratio: He3/D = 0.158 at 70 keV (Bosch-Hale) is 0.488. f_rad 0.23 is
  # the patent's own bremsstrahlung fraction at T_e = T_i; it sits above the
  # study's f_rad_floor() at this mix (0.20, calibrated with T_e = T_i/2 on
  # the blog-derived pair 0.163 at 0.314), so the vendor point is the more
  # conservative of the two. (The concept YAML's shipped default, f_rad 0.05
  # at dd_frac 0.131, is below the floor; this baseline does not use it.)
  # Vendor-implied per-pulse exhaust recovery (the closed-cycle fourth nine,
  # US 11,469,003 B2); the model default is the JET-ILW-analog 0.999, so the
  # vendor point carries its own value explicitly. Tier 1 reverts it, tier 2
  # re-grants it as a labelled extrapolation.
  fuel_recovery: 0.9999
  dhe3_dd_frac: 0.488
  f_rad: 0.23
